name: Keep API awake

# Render's free instances sleep after 15 minutes without traffic, which stops
# the in-process opportunity autopilot timer. A public health ping keeps the
# API awake; the autopilot itself is idempotent and needs no secret here.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 60 https://darbak-api.onrender.com/api/health
